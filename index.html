<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Dekho — B2B Discovery Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #0f2a4a;
      -webkit-font-smoothing: antialiased;
    }
    :root {
      --primary:          #0f766e;
      --primary-subtle:   #f0fdfa;
      --navy:             #0f2a4a;
      --navy-dark:        #0b1f3a;
      --canvas:           #f8fafc;
      --surface:          #ffffff;
      --subtle:           #f1f5f9;
      --border:           #e2e8f0;
      --border-strong:    #cbd5e1;
      --text-secondary:   #475569;
      --text-tertiary:    #64748b;
      --text-link:        #0f766e;
      --badge-l1:         #1d4ed8;
      --badge-l1-bg:      #eff6ff;
      --badge-l2-bg:      #f0fdf4;
      --badge-l2:         #166534;
      --badge-l3-bg:      #fffbeb;
      --badge-l3:         #92400e;
      --badge-unverified: #475569;
    }
    img { display: block; max-width: 100%; }
    a   { text-decoration: none; color: inherit; }
    button { border: none; cursor: pointer; background: none; font-family: inherit; }
    input::placeholder { color: var(--text-tertiary); }
    textarea::placeholder { color: var(--text-tertiary); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--canvas); }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const IMG  = { mfg: `${BASE}/2c6a5.png`, biz: `${BASE}/e0435.png` };

/* ── MOCK SUPPLIER DATA ── */
const SUPPLIERS = [
  { id:1, name:"Mehta Packworks",    industry:"Packaging & Paper",    location:"Gurugram, Haryana",    tier:1, desc:"Corrugated packaging for e-commerce and retail." },
  { id:2, name:"Sharma Textiles",    industry:"Textiles & Apparel",   location:"Surat, Gujarat",       tier:2, desc:"Fabric and garment manufacturing with export experience." },
  { id:3, name:"Krishna Industries", industry:"Industrial Equipment", location:"Pune, Maharashtra",    tier:2, desc:"Precision components and tooling for the automotive sector." },
  { id:4, name:"Agarwal Constructs", industry:"Construction",         location:"Delhi NCR",            tier:1, desc:"Building materials and civil supply for large projects." },
  { id:5, name:"Green Farms Co",     industry:"Food & Agriculture",   location:"Nashik, Maharashtra",  tier:0, desc:"Fresh produce and cold-chain logistics for HORECA buyers." },
  { id:6, name:"ChemSpec India",     industry:"Chemicals",            location:"Mumbai, Maharashtra",  tier:3, desc:"Specialty chemicals with full compliance documentation." },
  { id:7, name:"Ravi Paper Mills",   industry:"Packaging & Paper",    location:"Hyderabad, Telangana", tier:2, desc:"Kraft paper and board for industrial packaging needs." },
  { id:8, name:"Bharat Garments",    industry:"Textiles & Apparel",   location:"Tirupur, Tamil Nadu",  tier:1, desc:"Knitwear and workwear for domestic and export buyers." },

/* ── SVG ICON LIBRARY ── */

    stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);

  Search:     () => <Ico><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></Ico>,
  Grid:       () => <Ico s={16}><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></Ico>,

  UserCheck:  () => <Ico s={18}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></Ico>,
  CircleHelp: () => <Ico s={18}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></Ico>,
  BldgCheck:  () => <Ico s={18}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></Ico>,
  Package:    () => <Ico><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></Ico>,
  Shirt:      () => <Ico><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></Ico>,
  Gear:       () => <Ico><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Ico>,
  Building:   () => <Ico><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></Ico>,
  Leaf:       () => <Ico><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></Ico>,

  X:          () => <Ico><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Ico>,

  Tag:        () => <Ico s={16}><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></Ico>,
  ArrowLeft:  () => <Ico><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></Ico>,
};

/* ── BUTTON ── */
const Btn = ({ label, v = "primary", onClick, style: s }) => {
  const base = {
    display: "inline-flex", alignItems: "center", justifyContent: "center",
    height: 44, padding: "0 20px", borderRadius: 6,
    fontFamily: "Inter", fontWeight: 600, fontSize: 15, lineHeight: "24px",
    cursor: "pointer", whiteSpace: "nowrap", transition: "opacity .15s",
  };
  const vs = {
    primary:   { background: "var(--primary)",   color: "#fff",             border: "none" },
    secondary: { background: "var(--surface)",    color: "var(--navy-dark)", border: "1.5px solid var(--navy-dark)" },
    ghost:     { background: "transparent",       color: "var(--navy-dark)", border: "none" },
    whitebrd:  { background: "#fff",              color: "var(--navy)",      border: "1.5px solid #fff" },
  };
  return (
    <button onClick={onClick} style={{ ...base, ...vs[v], ...s }}
      onMouseEnter={e => e.currentTarget.style.opacity = ".85"}
      onMouseLeave={e => e.currentTarget.style.opacity = "1"}
    >{label}</button>
  );
};

/* ── VERIFICATION BADGE ── */
const Badge = ({ tier }) => {
  const cfg = {
    0: { icon: <Icon.CircleHelp />, label: "Tier 0 Registered",       bg: "var(--subtle)",      bd: "1px dashed var(--border-strong)", col: "var(--badge-unverified)" },
    1: { icon: <Icon.UserCheck />,  label: "Tier 1 Contact Verified",  bg: "var(--badge-l1-bg)", bd: "1px solid var(--badge-l1)",      col: "var(--badge-l1)" },
    2: { icon: <Icon.BldgCheck />,  label: "Tier 2 Business Verified", bg: "var(--badge-l2-bg)", bd: "none",                           col: "var(--badge-l2)" },
    3: { icon: <Icon.ShieldOk />,   label: "Tier 3 Premium",           bg: "var(--badge-l3-bg)", bd: "1px solid var(--badge-l3)",      col: "var(--badge-l3)" },
  }[tier];
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      height: 32, padding: "0 12px", borderRadius: 12, flexShrink: 0,
      background: cfg.bg, border: cfg.bd, color: cfg.col,
      fontWeight: 500, fontSize: 13, lineHeight: "20px",
    }}>
      <span style={{ color: cfg.col, display: "flex" }}>{cfg.icon}</span>
      {cfg.label}
    </span>
  );
};

/* ── NAVIGATION ── */
const Nav = ({ onNavigate, currentPage }) => {
  const [open, setOpen] = useState(false);
  const NAV_LINKS = [
    { label: "Find Suppliers", page: "find-suppliers" },
    { label: "For Sellers",    page: "for-sellers" },
    { label: "Pricing",        page: "pricing" },
    { label: "Contact",        page: "contact" },
  ];
  const go = (page) => { onNavigate(page); setOpen(false); };
  return (
    <>
      <nav style={{
        position: "sticky", top: 0, zIndex: 100,
        background: "var(--surface)", borderBottom: "1px solid var(--border)",
        height: 72, display: "flex", alignItems: "center",
        justifyContent: "space-between", padding: "0 80px",
      }}>
        <div style={{ display: "flex", gap: 40, alignItems: "center" }}>
          <button onClick={() => go('home')} style={{
            display: "flex", gap: 8, alignItems: "center",
            background: "none", border: "none", cursor: "pointer", padding: 0,
          }}>
            <div style={{
              width: 32, height: 32, borderRadius: 8,
              background: "var(--navy-dark)", color: "#fff",
              display: "flex", alignItems: "center", justifyContent: "center",
            }}><Icon.Shield /></div>
            <span style={{ fontWeight: 600, fontSize: 20, letterSpacing: "-0.2px", color: "var(--navy-dark)" }}>
              Business Dekho
            </span>
          </button>
          <div style={{ display: "flex", gap: 28, alignItems: "center" }} className="nav-links">
            {NAV_LINKS.map(({ label, page }) => (
              <button key={page} onClick={() => go(page)} style={{
                fontWeight: 500, fontSize: 14, fontFamily: "Inter", padding: 0,
                color: currentPage === page ? "var(--primary)" : "var(--text-secondary)",
                background: "none", border: "none", cursor: "pointer", transition: "color .15s",
              }}
                onMouseEnter={e => e.currentTarget.style.color = "var(--navy)"}
                onMouseLeave={e => e.currentTarget.style.color = currentPage === page ? "var(--primary)" : "var(--text-secondary)"}
              >{label}</button>
            ))}
          </div>
        </div>
        <div style={{ display: "flex", gap: 12, alignItems: "center" }} className="nav-cta">
          <Btn label="Log in"      v="ghost"   onClick={() => go('login')} />
          <Btn label="Get Started" v="primary" onClick={() => go('get-started')} />
        </div>
        <button className="hamburger" onClick={() => setOpen(!open)}
          style={{ display: "none", color: "var(--navy)", padding: 4 }}>
          {open ? <Icon.X /> : <Icon.Menu />}
        </button>
      </nav>

      {open && (
        <div style={{
          position: "fixed", top: 72, left: 0, right: 0, bottom: 0, zIndex: 99,
          background: "var(--surface)", padding: 24,
          display: "flex", flexDirection: "column", gap: 16, borderTop: "1px solid var(--border)",
          overflowY: "auto",
        }}>
          {NAV_LINKS.map(({ label, page }) => (
            <button key={page} onClick={() => go(page)} style={{
              fontWeight: 500, fontSize: 18, color: "var(--navy)", padding: "10px 0",
              borderBottom: "1px solid var(--border)", background: "none", border: "none",
              borderBottomWidth: 1, borderBottomStyle: "solid", borderBottomColor: "var(--border)",
              cursor: "pointer", fontFamily: "Inter", textAlign: "left",
            }}>{label}</button>
          ))}
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 8 }}>
            <Btn label="Log in"      v="secondary" onClick={() => go('login')}       style={{ width: "100%", borderRadius: 8 }} />
            <Btn label="Get Started" v="primary"   onClick={() => go('get-started')} style={{ width: "100%", borderRadius: 8 }} />
          </div>
        </div>
      )}

      <style>{`
        @media (max-width: 768px) {
          nav { padding: 0 24px !important; }
          .nav-links, .nav-cta { display: none !important; }
          .hamburger { display: flex !important; }
        }
      `}</style>
    </>
  );
};

/* ── HERO ── */
const Hero = ({ onNavigate }) => {
  const [q, setQ] = useState("");
  return (
    <section style={{

      padding: "72px 120px", background: "var(--canvas)",
    }} className="hero-section">
      <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 24, minWidth: 0 }}>
        <p style={{ fontWeight: 600, fontSize: 12, letterSpacing: "0.6px", textTransform: "uppercase", color: "var(--text-link)" }}>
          A clearer way to source
        </p>
        <h1 style={{ fontWeight: 700, fontSize: 40, lineHeight: "48px", letterSpacing: "-0.8px", color: "#0f2a4a" }}>
          Find verified suppliers.<br />Connect with confidence.

        <p style={{ fontSize: 16, lineHeight: "24px", color: "var(--text-secondary)" }}>

            style={{
              flex: 1, border: "none", outline: "none", background: "transparent",
              fontFamily: "Inter", fontSize: 16, color: "var(--navy)", minWidth: 0,
            }} />
          <button onClick={() => onNavigate('find-suppliers')} style={{
            background: "var(--primary)", color: "#fff",
            fontFamily: "Inter", fontWeight: 600, fontSize: 16,
            border: "none", borderRadius: 6, height: 48, padding: "0 24px",
            cursor: "pointer", flexShrink: 0, transition: "opacity .15s",
          }}
            onMouseEnter={e => e.currentTarget.style.opacity = ".88"}
            onMouseLeave={e => e.currentTarget.style.opacity = "1"}

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {["Packaging","Textiles","Equipment"].map(cat => (

              display: "inline-flex", alignItems: "center", gap: 6,
              height: 32, padding: "0 12px", borderRadius: 999,
              background: "var(--surface)", border: "1px solid var(--border-strong)",
              fontWeight: 500, fontSize: 14, color: "var(--text-secondary)", cursor: "pointer",
              transition: "border-color .15s, color .15s",
            }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--primary)"; e.currentTarget.style.color = "var(--primary)"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--border-strong)"; e.currentTarget.style.color = "var(--text-secondary)"; }}

        <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
          <span style={{ color: "var(--primary)", display: "flex", flexShrink: 0 }}><Icon.ShieldOk /></span>
          <p style={{ fontSize: 14, lineHeight: "20px", color: "var(--text-secondary)" }}>
            Transparent tiers. No hidden trust claims.
          </p>
        </div>
      </div>

      <div style={{
        width: 440, flexShrink: 0,
        background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12,
        overflow: "hidden",
        boxShadow: "0 1px 3px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.08)",
      }} className="spotlight-card">
        <div style={{ height: 280, background: "#e2e8f0", overflow: "hidden" }}>
          <img src={IMG.mfg} alt="Manufacturing" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
        </div>
        <div style={{ padding: 24, display: "flex", flexDirection: "column", gap: 12 }}>
          <p style={{ fontWeight: 600, fontSize: 12, letterSpacing: "0.6px", textTransform: "uppercase", color: "var(--text-secondary)" }}>
            Supplier spotlight · Example profile
          </p>
          <p style={{ fontWeight: 600, fontSize: 20, lineHeight: "28px", letterSpacing: "-0.2px", color: "#0f2a4a" }}>
            Mehta Packworks
          </p>
          <Badge tier={1} />
          <p style={{ fontSize: 14, lineHeight: "20px", color: "var(--text-secondary)" }}>
            Corrugated packaging · Gurugram, Haryana
          </p>
          <p style={{ fontSize: 12, lineHeight: "16px", color: "var(--text-secondary)" }}>
            Contacts verified. Business review pending.
          </p>
        </div>
      </div>

      <style>{`
        .hero-section   { flex-wrap: wrap; }
        .spotlight-card { width: 100%; }
        @media (min-width: 1024px) { .spotlight-card { width: 440px !important; } }
        @media (max-width: 1024px) { .hero-section { padding: 48px !important; } }
        @media (max-width: 640px)  {
          .hero-section { padding: 40px 24px !important; }

/* ── STATS ── */

  <section style={{ background: "var(--surface)", padding: "32px 120px" }} className="stats-section">
    <div style={{ display: "flex", flexWrap: "wrap", gap: 24, marginBottom: 16 }}>
      {[["2,400+","Supplier profiles"],["12","Industry categories"],["28","States represented"],["4","Transparent badge tiers"]].map(([v,l]) => (
        <div key={l} style={{ flex: "1 0 140px", display: "flex", flexDirection: "column", gap: 8 }}>
          <p style={{ fontWeight: 700, fontSize: 32, lineHeight: "40px", letterSpacing: "-0.5px", color: "#0f2a4a" }}>{v}</p>
          <p style={{ fontSize: 14, lineHeight: "20px", color: "var(--text-secondary)" }}>{l}</p>
        </div>
      ))}
    </div>
    <p style={{ fontSize: 12, color: "var(--text-secondary)" }}>Illustrative concept statistics, not audited marketplace claims.</p>
    <style>{`@media (max-width: 768px) { .stats-section { padding: 32px 24px !important; } }`}</style>
  </section>
);

/* ── HOW IT WORKS ── */

  const Card = ({ heading, steps }) => (
    <div style={{
      flex: 1, minWidth: 280, background: "var(--surface)", border: "1px solid var(--border)",

    }}>
      <h3 style={{ fontWeight: 600, fontSize: 20, lineHeight: "28px", letterSpacing: "-0.2px" }}>{heading}</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
        {steps.map(([n,t,d]) => (
          <div key={n} style={{ display: "flex", gap: 16 }}>
            <div style={{
              width: 32, height: 32, borderRadius: 12, flexShrink: 0,

const FindSuppliersPage = () => {
  const [q, setQ] = useState("");
  const [industry, setIndustry] = useState("All");
  const [tierF, setTierF] = useState("All");
  const INDUSTRIES = ["All","Packaging & Paper","Textiles & Apparel","Industrial Equipment","Construction","Food & Agriculture","Chemicals"];
  const TIERS = ["All","Tier 0","Tier 1","Tier 2","Tier 3"];

  const filtered = SUPPLIERS.filter(s => {
    const qL = q.toLowerCase();
    const matchQ = !q || s.name.toLowerCase().includes(qL) || s.industry.toLowerCase().includes(qL) || s.location.toLowerCase().includes(qL);
    const matchI = industry === "All" || s.industry === industry;
    const matchT = tierF === "All" || s.tier === parseInt(tierF.split(" ")[1]);
    return matchQ && matchI && matchT;
  });

  const chipStyle = (active) => ({
    padding: "5px 14px", borderRadius: 999, fontSize: 13, fontWeight: 500,
    fontFamily: "Inter", cursor: "pointer", transition: "all .15s",
    background: active ? "var(--primary)" : "var(--surface)",
    color: active ? "#fff" : "var(--text-secondary)",
    border: active ? "1.5px solid var(--primary)" : "1.5px solid var(--border-strong)",
  });

  return (
    <div>
      <div style={{ background: "var(--surface)", borderBottom: "1px solid var(--border)", padding: "32px 120px" }} className="fs-top">
        <h1 style={{ fontWeight: 700, fontSize: 28, letterSpacing: "-0.5px", marginBottom: 20 }}>Find Suppliers</h1>
        <div style={{
          background: "var(--canvas)", border: "1px solid var(--border-strong)",
          borderRadius: 10, display: "flex", alignItems: "center",

        }}>
          <span style={{ color: "var(--text-tertiary)", display: "flex" }}><Icon.Search /></span>
          <input value={q} onChange={e => setQ(e.target.value)}
            placeholder="Search by name, product or location"
            style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontFamily: "Inter", fontSize: 15, color: "var(--navy)" }} />
          {q && <button onClick={() => setQ("")} style={{ color: "var(--text-tertiary)", display: "flex" }}><Icon.X /></button>}
        </div>

        <div style={{ display: "flex", gap: 32, flexWrap: "wrap" }}>
          <div>
            <p style={{ fontSize: 11, fontWeight: 700, color: "var(--text-secondary)", letterSpacing: "0.6px", textTransform: "uppercase", marginBottom: 8 }}>Industry</p>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {INDUSTRIES.map(ind => (
                <button key={ind} onClick={() => setIndustry(ind)} style={chipStyle(industry === ind)}>{ind}</button>
              ))}
            </div>
          </div>
          <div>
            <p style={{ fontSize: 11, fontWeight: 700, color: "var(--text-secondary)", letterSpacing: "0.6px", textTransform: "uppercase", marginBottom: 8 }}>Verification</p>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {TIERS.map(t => (
                <button key={t} onClick={() => setTierF(t)} style={chipStyle(tierF === t)}>{t}</button>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div style={{ padding: "32px 120px" }} className="fs-body">
        <p style={{ fontSize: 14, color: "var(--text-secondary)", marginBottom: 20 }}>
          {filtered.length} supplier{filtered.length !== 1 ? "s" : ""} found
        </p>
        {filtered.length === 0 ? (
          <div style={{ textAlign: "center", padding: "64px 0", color: "var(--text-secondary)" }}>
            <p style={{ fontSize: 18, fontWeight: 600, marginBottom: 8 }}>No suppliers found</p>
            <p style={{ fontSize: 14 }}>Try adjusting your search or filters.</p>
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 20 }}>
            {filtered.map(s => (
              <div key={s.id} style={{
                background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 24,
                display: "flex", flexDirection: "column", gap: 14,
                transition: "box-shadow .2s, border-color .2s", cursor: "pointer",
              }}
                onMouseEnter={e => { e.currentTarget.style.boxShadow = "0 4px 16px rgba(15,118,110,.12)"; e.currentTarget.style.borderColor = "var(--primary)"; }}
                onMouseLeave={e => { e.currentTarget.style.boxShadow = "none"; e.currentTarget.style.borderColor = "var(--border)"; }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                  <p style={{ fontWeight: 700, fontSize: 17, lineHeight: "24px", color: "#0f2a4a" }}>{s.name}</p>
                  <Badge tier={s.tier} />
                </div>
                <p style={{ fontSize: 14, lineHeight: "20px", color: "var(--text-secondary)" }}>{s.desc}</p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 13, color: "var(--text-tertiary)" }}>
                    <Icon.Tag />{s.industry}

                  <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 13, color: "var(--text-tertiary)" }}>
                    <Icon.MapPin />{s.location}
                  </span>
                </div>
                <button style={{
                  marginTop: 4, padding: "8px 16px", borderRadius: 8, fontSize: 14, fontWeight: 600,
                  fontFamily: "Inter", cursor: "pointer", transition: "opacity .15s",
                  background: "var(--primary-subtle)", color: "var(--primary)", border: "1px solid var(--primary)",
                }}
                  onMouseEnter={e => e.currentTarget.style.opacity = ".8"}
                  onMouseLeave={e => e.currentTarget.style.opacity = "1"}
                >View Profile</button>
              </div>
            ))}
          </div>
        )}
      </div>
      <style>{`
        @media (max-width: 768px) { .fs-top, .fs-body { padding-left: 24px !important; padding-right: 24px !important; } }
      `}</style>

  );
